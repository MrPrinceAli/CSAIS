# Pekerja pipeline CSAIS harian di GitHub Actions (gratis).
#
# Alur: pulihkan database SQLite dari cache (atau dari rilis "bootstrap" pada
# run pertama), crawl tanpa prompt, olah artikel baru, ambil isi artikel dengan
# anggaran, cari gambar incident terbaru, terbitkan hasil ke Turso, simpan
# database ke cache lagi. Setiap Minggu (UTC) database juga diunggah ulang ke
# rilis "bootstrap" sebagai cadangan, supaya cache Actions yang hilang tidak
# menghapus data setelah bootstrap pertama.
#
# Rahasia yang harus diisi di Settings > Secrets and variables > Actions:
#   TURSO_DATABASE_URL, TURSO_AUTH_TOKEN
#   SURVEY_DATABASE_URL, SURVEY_AUTH_TOKEN (opsional, alur D2)
# Bootstrap sekali (dari komputer lokal, database saat ini):
#   gh release create bootstrap database/csais.db --title "Database bootstrap"
#
# Pemicu manual (tab Actions > Run workflow) menerima:
#   fetch_budget      anggaran isi artikel
#   image_budget      anggaran incident yang dicarikan gambar
#   reset_from        kosong = tidak reset; 2-7 = hapus hasil V0.N sampai V0.7
#                     lalu proses ulang (setelah logika tahap itu berubah)
#   refresh_bootstrap true = unggah database ke rilis bootstrap pada run ini

name: CSAIS daily pipeline

on:
  schedule:
    - cron: "0 21 * * *" # 21:00 UTC = 04:00 WIB
  workflow_dispatch:
    inputs:
      fetch_budget:
        description: "Maksimal artikel yang diambil isinya"
        default: "300"
      image_budget:
        description: "Maksimal incident yang dicarikan gambar"
        default: "120"
      reset_from:
        description: "Proses ulang mulai tahap V0.N (2-7); kosongkan bila tidak"
        default: ""
      refresh_bootstrap:
        description: "Unggah database ke rilis bootstrap pada run ini"
        type: boolean
        default: false

concurrency:
  group: csais-pipeline
  cancel-in-progress: false

permissions:
  contents: write # unduh dan unggah aset rilis bootstrap

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Pasang dependensi
        run: pip install -r requirements.txt

      - name: Pulihkan database dari cache
        id: db-cache
        uses: actions/cache/restore@v4
        with:
          path: database/csais.db
          key: csais-db-${{ github.run_id }}
          restore-keys: |
            csais-db-

      - name: Bootstrap database dari rilis (run pertama saja)
        if: steps.db-cache.outputs.cache-matched-key == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p database
          # Tanpa rilis bootstrap, job dihentikan: database kosong yang ikut
          # tersimpan ke cache akan menutupi bootstrap pada run berikutnya.
          gh release download bootstrap --pattern csais.db --dir database || {
            echo "::error::Rilis bootstrap belum ada; jalankan scripts/setup_cloud.sh dulu."
            exit 1
          }

      - name: Crawl, olah, ambil isi artikel, terbitkan ke Turso
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          # database survei publik (alur D2), token baca saja; kosong = tahap D2 dilewati
          SURVEY_DATABASE_URL: ${{ secrets.SURVEY_DATABASE_URL }}
          SURVEY_AUTH_TOKEN: ${{ secrets.SURVEY_AUTH_TOKEN }}
          # off (default) atau fill_unknown: isi kolom V0.3 yang kosong dari hasil LLM lokal
          LLM_MERGE: ${{ vars.LLM_MERGE }}
        run: |
          # Terbitkan hanya bila rahasia Turso sudah diisi; tanpa itu pipeline
          # tetap berjalan dan database tetap tersimpan di cache.
          PUBLISH=""
          if [ -n "$TURSO_DATABASE_URL" ] && [ -n "$TURSO_AUTH_TOKEN" ]; then
            PUBLISH="--publish"
          else
            echo "::warning::Rahasia Turso belum diisi; tahap terbit dilewati."
          fi
          RESET=""
          RESET_FROM="${{ github.event.inputs.reset_from }}"
          if [ -n "$RESET_FROM" ]; then
            RESET="--reset-from $RESET_FROM --yes"
            echo "::notice::Proses ulang mulai tahap V0.$RESET_FROM"
          fi
          python main.py --crawl \
            --fetch-budget "${{ github.event.inputs.fetch_budget || '300' }}" \
            --image-budget "${{ github.event.inputs.image_budget || '120' }}" \
            $RESET $PUBLISH

      - name: Laporan perbandingan alur D1 - D4
        if: success()
        run: python eval/compare_flows.py --out eval/flows > /dev/null

      - name: Unggah laporan perbandingan
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flow-report-${{ github.run_id }}
          path: eval/flows/
          retention-days: 90

      - name: Simpan database ke cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: database/csais.db
          key: csais-db-${{ github.run_id }}

      - name: Perbarui rilis bootstrap (cadangan mingguan)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ github.event.inputs.refresh_bootstrap }}
        run: |
          # Setiap Minggu UTC, atau bila diminta lewat input refresh_bootstrap.
          if [ "$(date -u +%u)" = "7" ] || [ "$FORCE" = "true" ]; then
            gh release upload bootstrap database/csais.db --clobber
            echo "Rilis bootstrap diperbarui ($(du -h database/csais.db | cut -f1))."
          else
            echo "Bukan hari cadangan; rilis bootstrap tidak disentuh."
          fi

      - name: Unggah log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: logs/
          retention-days: 14
